version: '3.8'

services:
  db:
    image: postgres:15
    container_name: oracullo_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_admin_password
    ports:
      - "5432:5432"
    volumes:
      - ./docker-init.sh:/docker-entrypoint-initdb.d/01-init.sh
      - ./backend/database:/docker-entrypoint-initdb.d/sql
    restart: unless-stopped
